<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoApp &mdash; Get Things Done</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="shell">
    <header class="hero">
      <div class="hero-badge">&#10003; TodoApp</div>
      <h1 class="hero-title">Get things <span class="gradient">done</span></h1>
      <p class="hero-sub">A clean, fast, full-stack to-do app. Tasks are stored by the C# backend and survive restarts.</p>
    </header>

    <section class="card composer-card">
      <form id="taskForm" autocomplete="off" class="composer">
        <label class="sr-only" for="taskTitle">New task title</label>
        <input type="text" id="taskTitle" name="title" class="composer-input"
               placeholder="What needs to be done?" maxlength="120" required>
        <button type="submit" class="btn btn-primary" id="addBtn">
          <span class="btn-plus">+</span> Add task
        </button>
      </form>
      <p id="formError" class="form-error" hidden></p>
    </section>

    <section class="card list-card">
      <div class="list-head">
        <div class="filters" role="tablist" aria-label="Task filters">
          <button type="button" class="filter is-active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="active">Active</button>
          <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>
        <button type="button" class="clear-btn" id="clearCompleted">Clear completed</button>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">&#10003;</div>
        <p id="emptyText">No tasks yet. Add your first one above.</p>
      </div>

      <footer class="list-foot">
        <span id="taskCount">0 tasks</span>
        <div class="progress-wrap" title="Completion progress">
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-label" id="progressLabel">0%</span>
        </div>
        <span class="foot-hint">Enter to add</span>
      </footer>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
